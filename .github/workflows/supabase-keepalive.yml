name: Supabase keep-alive

# The free Supabase plan pauses a project after 7 days without database activity (owner, Oct 2026: the judges may open the
# site 1–2 weeks after the deadline). Twice a day this calls public.ping() — a function that only returns the time.
# Needs two repository secrets (Settings → Secrets and variables → Actions): SUPABASE_URL and SUPABASE_ANON_KEY
# (the same public values as the site's VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY). Without them it does nothing.
# Scheduled workflows run from the default branch (main) only.
on:
  schedule:
    - cron: '23 1,13 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # owner, Oct 2026: a missing secret must not pass silently (the database would pause unnoticed) → fail, GitHub e-mails the owner
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::The secrets SUPABASE_URL and SUPABASE_ANON_KEY are not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # tidy the values like the website does: spaces, quotes, a trailing slash or /rest/v1 pasted along (every run since 7 Oct got 404)
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]"'"'"'' | sed -E 's#/+$##; s#/rest/v1$##; s#/+$##')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]"'"'"'')
          case "$url" in https://*.supabase.co) ;; *) echo "::error::SUPABASE_URL should look like https://<project>.supabase.co"; exit 1 ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/rest/v1/rpc/ping" \
            -H "apikey: $key" -H "Authorization: Bearer $key" -H "Content-Type: application/json" -d '{}')
          echo "ping → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Supabase did not answer (HTTP $code). If the project is paused, open the Supabase dashboard and press Resume."
            exit 1
          fi
