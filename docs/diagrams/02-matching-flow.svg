<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>ขั้นตอนการจับคู่งานตอนนี้</title><desc>นายจ้างกรอกโพสต์ ตรวจเบื้องต้น ยืนยัน เช็กโควตา แล้วโพสต์ ระบบแจ้งผู้หางานเป็นสามขั้นตามวัน ผู้หางานกดรับ แล้วส่งต่อหน่วยงานจัดหางานแบบจำลอง</desc><style>
.t,.ts,.th{font-family:'Noto Sans Thai','Segoe UI','PingFang SC',sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#888780}.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){.t,.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.box{fill:#2C2C2A;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="40" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="59" text-anchor="middle" dominant-baseline="central">นายจ้างกรอกโพสต์</text><text class="ts" x="170" y="78" text-anchor="middle" dominant-baseline="central">ข้อมูลงาน 4 กลุ่ม</text></g><g class="c-purple"><rect x="40" y="120" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="139" text-anchor="middle" dominant-baseline="central">ตรวจเบื้องต้น (จำลอง AI)</text><text class="ts" x="170" y="158" text-anchor="middle" dominant-baseline="central">มีข้อผิด → กลับไปแก้</text></g><g class="c-purple"><rect x="40" y="200" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="219" text-anchor="middle" dominant-baseline="central">ยืนยันโพสต์</text><text class="ts" x="170" y="238" text-anchor="middle" dominant-baseline="central">ถามก่อนโพสต์จริง</text></g><g class="c-purple"><rect x="40" y="280" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="299" text-anchor="middle" dominant-baseline="central">เช็กโควตา 7 วัน</text><text class="ts" x="170" y="318" text-anchor="middle" dominant-baseline="central">เกิน 3 → แพ็กสมาชิก (10)</text></g><g class="c-purple"><rect x="40" y="360" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="379" text-anchor="middle" dominant-baseline="central">โพสต์แล้ว</text><text class="ts" x="170" y="398" text-anchor="middle" dominant-baseline="central">ดูสถานะได้ที่หน้าโพสต์</text></g><g class="c-teal"><rect x="380" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="59" text-anchor="middle" dominant-baseline="central">ขั้น 1 · วันแรก</text><text class="ts" x="510" y="78" text-anchor="middle" dominant-baseline="central">จังหวัดเดียวกัน + ตรงสาย</text></g><g class="c-teal"><rect x="380" y="120" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="139" text-anchor="middle" dominant-baseline="central">ขั้น 2 · หลัง 1 วัน</text><text class="ts" x="510" y="158" text-anchor="middle" dominant-baseline="central">จังหวัดเดียวกันทุกสาย</text></g><g class="c-teal"><rect x="380" y="200" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="219" text-anchor="middle" dominant-baseline="central">ขั้น 3 · หลัง 2 วัน</text><text class="ts" x="510" y="238" text-anchor="middle" dominant-baseline="central">ทั้งประเทศ (ที่ปักหมุดไว้)</text></g><g class="c-teal"><rect x="380" y="280" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="299" text-anchor="middle" dominant-baseline="central">ผู้หางานกดรับ</text><text class="ts" x="510" y="318" text-anchor="middle" dominant-baseline="central">มีคนรับ → หยุดขยายวง</text></g><g class="c-teal"><rect x="380" y="360" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="379" text-anchor="middle" dominant-baseline="central">ส่งต่อหน่วยงานจัดหางาน</text><text class="ts" x="510" y="398" text-anchor="middle" dominant-baseline="central">ตอนนี้เป็นการจำลอง</text></g><line x1="170" y1="96" x2="170" y2="118" class="arr" marker-end="url(#arrow)"/><line x1="510" y1="96" x2="510" y2="118" class="arr" marker-end="url(#arrow)"/><line x1="170" y1="176" x2="170" y2="198" class="arr" marker-end="url(#arrow)"/><line x1="510" y1="176" x2="510" y2="198" class="arr" marker-end="url(#arrow)"/><line x1="170" y1="256" x2="170" y2="278" class="arr" marker-end="url(#arrow)"/><line x1="510" y1="256" x2="510" y2="278" class="arr" marker-end="url(#arrow)"/><line x1="170" y1="336" x2="170" y2="358" class="arr" marker-end="url(#arrow)"/><line x1="510" y1="336" x2="510" y2="358" class="arr" marker-end="url(#arrow)"/><path d="M302 388 L340 388 L340 68 L376 68" class="arr" marker-end="url(#arrow)"/><rect class="c-purple" x="40" y="440" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="62" y="447" dominant-baseline="central">ฝั่งนายจ้าง</text><rect class="c-teal" x="200" y="440" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="222" y="447" dominant-baseline="central">ฝั่งผู้หางาน / ระบบแจ้งเตือน</text></svg>
