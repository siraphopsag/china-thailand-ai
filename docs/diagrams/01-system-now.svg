<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><title>โครงสร้างระบบ C.A.L.L. ตอนนี้ (ต้นแบบ)</title><desc>เบราว์เซอร์ของผู้ใช้มีหน้านายจ้าง ผู้หางาน หลังบ้าน ตัวตรวจเบื้องต้น ข้อมูลในเครื่อง และคลังกฎหมาย เชื่อมกับ Vercel, GitHub Actions และเว็บไซต์ราชการ (ยังไม่มีเซิร์ฟเวอร์ API)</desc><style>
.t,.ts,.th{font-family:'Noto Sans Thai','Segoe UI','PingFang SC',sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#888780}.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){.t,.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.box{fill:#2C2C2A;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="40" y="30" width="400" height="270" rx="20" stroke-width="0.5"/><text class="th" x="60" y="56" dominant-baseline="central">เบราว์เซอร์ของผู้ใช้ (เว็บแอป React)</text></g><g><rect class="box" x="60" y="80" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="99" text-anchor="middle" dominant-baseline="central">นายจ้าง</text><text class="ts" x="115" y="118" text-anchor="middle" dominant-baseline="central">โพสต์งาน</text></g><g><rect class="box" x="185" y="80" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="240" y="99" text-anchor="middle" dominant-baseline="central">ผู้หางาน</text><text class="ts" x="240" y="118" text-anchor="middle" dominant-baseline="central">ปักหมุด · รับงาน</text></g><g><rect class="box" x="310" y="80" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="365" y="99" text-anchor="middle" dominant-baseline="central">หลังบ้าน</text><text class="ts" x="365" y="118" text-anchor="middle" dominant-baseline="central">แอดมินดูเคส</text></g><g><rect class="box" x="60" y="156" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="145" y="175" text-anchor="middle" dominant-baseline="central">ตรวจเบื้องต้น</text><text class="ts" x="145" y="194" text-anchor="middle" dominant-baseline="central">กฎง่าย ๆ (จำลอง AI)</text></g><g><rect class="box" x="250" y="156" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="335" y="175" text-anchor="middle" dominant-baseline="central">ข้อมูลในเครื่อง</text><text class="ts" x="335" y="194" text-anchor="middle" dominant-baseline="central">เก็บในเบราว์เซอร์</text></g><g><rect class="box" x="60" y="232" width="360" height="44" rx="8" stroke-width="0.5"/><text class="th" x="240" y="254" text-anchor="middle" dominant-baseline="central">คลังกฎหมาย + ระดับความน่าเชื่อถือ</text></g><g class="c-teal"><rect x="480" y="40" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="59" text-anchor="middle" dominant-baseline="central">Vercel</text><text class="ts" x="560" y="78" text-anchor="middle" dominant-baseline="central">โฮสต์หน้าเว็บ</text></g><g class="c-teal"><rect x="480" y="220" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="239" text-anchor="middle" dominant-baseline="central">GitHub Actions</text><text class="ts" x="560" y="258" text-anchor="middle" dominant-baseline="central">เฝ้ากฎหมายทุกวัน</text></g><g class="c-teal"><rect x="480" y="310" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="329" text-anchor="middle" dominant-baseline="central">เว็บไซต์ราชการ</text><text class="ts" x="560" y="348" text-anchor="middle" dominant-baseline="central">ตัวบทกฎหมายต้นทาง</text></g><line x1="478" y1="68" x2="444" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="478" y1="248" x2="444" y2="248" class="arr" marker-end="url(#arrow)"/><line x1="560" y1="310" x2="560" y2="280" class="arr" marker-end="url(#arrow)"/><rect class="c-purple" x="40" y="388" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="62" y="395" dominant-baseline="central">ทำงานในเครื่องผู้ใช้</text><rect class="c-teal" x="230" y="388" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="252" y="395" dominant-baseline="central">บริการภายนอก</text></svg>
