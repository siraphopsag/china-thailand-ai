<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img"><title>โครงสร้างระบบ C.A.L.L. ที่เสนอสำหรับอนาคต</title><desc>ผู้ใช้สามกลุ่มเข้าเว็บแอป เว็บแอปคุยกับเซิร์ฟเวอร์ API ตัวกลาง ซึ่งเชื่อมบริการภายนอกหกอย่าง ได้แก่ บัญชีผู้ใช้ ฐานข้อมูลกลาง AI จริง แจ้งเตือน ชำระเงิน และหน่วยงานจัดหางาน</desc><style>
.t,.ts,.th{font-family:'Noto Sans Thai','Segoe UI','PingFang SC',sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#888780}.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){.t,.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.box{fill:#2C2C2A;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g><rect class="box" x="40" y="40" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130" y="62" text-anchor="middle" dominant-baseline="central">นายจ้าง</text></g><g><rect class="box" x="250" y="40" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">ผู้หางาน</text></g><g><rect class="box" x="460" y="40" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="550" y="62" text-anchor="middle" dominant-baseline="central">แอดมิน / หน่วยงานรัฐ</text></g><line x1="130" y1="84" x2="130" y2="122" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="84" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/><line x1="550" y1="84" x2="550" y2="122" class="arr" marker-end="url(#arrow)"/><g class="c-purple"><rect x="40" y="124" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="143" text-anchor="middle" dominant-baseline="central">เว็บแอป C.A.L.L. (มีอยู่แล้ว)</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">หน้าจอ 3 ภาษา · แผนที่ · ฟอร์ม</text></g><line x1="340" y1="180" x2="340" y2="218" class="arr" marker-end="url(#arrow)"/><g class="c-purple"><rect x="40" y="220" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="239" text-anchor="middle" dominant-baseline="central">เซิร์ฟเวอร์ API ตัวกลาง (ต้องสร้างเพิ่ม)</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">ตรวจสิทธิ์ · กันสแปม · เก็บคีย์ลับ · บันทึกการใช้งาน</text></g><line x1="340" y1="276" x2="340" y2="314" class="arr" marker-end="url(#arrow)"/><rect class="dash" x="40" y="316" width="600" height="192" rx="12" stroke-dasharray="4 4" stroke-width="0.5"/><text class="ts" x="60" y="336" dominant-baseline="central">บริการที่จะเชื่อมในอนาคต</text><g class="c-teal"><rect x="60" y="352" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="145" y="371" text-anchor="middle" dominant-baseline="central">บัญชีผู้ใช้</text><text class="ts" x="145" y="390" text-anchor="middle" dominant-baseline="central">ล็อกอินจริง</text></g><g class="c-teal"><rect x="250" y="352" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="335" y="371" text-anchor="middle" dominant-baseline="central">ฐานข้อมูลกลาง</text><text class="ts" x="335" y="390" text-anchor="middle" dominant-baseline="central">ข้อมูลตรงกันทุกเครื่อง</text></g><g class="c-teal"><rect x="440" y="352" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="525" y="371" text-anchor="middle" dominant-baseline="central">AI จริง (LLM)</text><text class="ts" x="525" y="390" text-anchor="middle" dominant-baseline="central">ตรวจโพสต์ · ตอบกฎหมาย</text></g><g class="c-teal"><rect x="60" y="428" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="145" y="447" text-anchor="middle" dominant-baseline="central">แจ้งเตือน</text><text class="ts" x="145" y="466" text-anchor="middle" dominant-baseline="central">LINE · SMS · อีเมล</text></g><g class="c-teal"><rect x="250" y="428" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="335" y="447" text-anchor="middle" dominant-baseline="central">ชำระเงิน</text><text class="ts" x="335" y="466" text-anchor="middle" dominant-baseline="central">แพ็กสมาชิก</text></g><g class="c-teal"><rect x="440" y="428" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="525" y="447" text-anchor="middle" dominant-baseline="central">หน่วยงานจัดหางาน</text><text class="ts" x="525" y="466" text-anchor="middle" dominant-baseline="central">ส่งต่อเคสจริง</text></g><rect class="c-purple" x="40" y="528" width="14" height="14" rx=