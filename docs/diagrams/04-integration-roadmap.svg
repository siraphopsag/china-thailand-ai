<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img"><title>แผนการเชื่อมต่อในอนาคตทีละเฟส</title><desc>จากต้นแบบตอนนี้ ไปเฟส 1 รากฐาน เฟส 2 เชื่อม AI และแจ้งเตือน เฟส 3 เปิดใช้จริง และเฟส 4 ขยายอาเซียน</desc><style>
.t,.ts,.th{font-family:'Noto Sans Thai','Segoe UI','PingFang SC',sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#888780}.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{fill:none;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
@media (prefers-color-scheme:dark){.t,.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.box{fill:#2C2C2A;stroke:#888780}
.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}
.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#9FE1CB}.c-teal>.ts{fill:#5DCAA5}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g><rect class="box" x="130" y="40" width="420" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">ตอนนี้ · ต้นแบบบน Preview</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">ข้อมูลจำลอง · ทุกอย่างอยู่ในเบราว์เซอร์</text></g><g class="c-purple"><rect x="130" y="124" width="420" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="143" text-anchor="middle" dominant-baseline="central">เฟส 1 · รากฐาน</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">บัญชีผู้ใช้ · ฐานข้อมูลกลาง · เซิร์ฟเวอร์ API</text></g><g class="c-purple"><rect x="130" y="208" width="420" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="227" text-anchor="middle" dominant-baseline="central">เฟส 2 · เชื่อม AI และแจ้งเตือน</text><text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">AI ตรวจโพสต์และตอบกฎหมาย · LINE / SMS</text></g><g class="c-purple"><rect x="130" y="292" width="420" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="311" text-anchor="middle" dominant-baseline="central">เฟส 3 · เปิดใช้จริง</text><text class="ts" x="340" y="330" text-anchor="middle" dominant-baseline="central">ชำระเงิน · ส่งต่อหน่วยงาน · PDPA</text></g><g class="c-purple"><rect x="130" y="376" width="420" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="395" text-anchor="middle" dominant-baseline="central">เฟส 4 · ขยายอาเซียน</text><text class="ts" x="340" y="414" text-anchor="middle" dominant-baseline="central">เปิดประเทศที่ขึ้นว่า เร็ว ๆ นี้</text></g><line x1="340" y1="96" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="180" x2="340" y2="206" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="264" x2="340" y2="290" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="348" x2="340" y2="374" class="arr" marker-end="url(#arrow)"/></svg>
